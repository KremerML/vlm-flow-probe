# FROZEN reproduction config — fully resolved, no include:.
# Translated from the archive repo's configs/clevr_lite/multilayer_l10-14_attn_out_question.yaml (schema updated: adapter key added,
# d_model/conv_mode/model_base removed, checkpoint name mapped to the HF-native
# llava-hf/llava-1.5-7b-hf whose equivalence the gate establishes).
# Reproduces the archived experiment 'multilayer_clevr_lite_l10-14_attn_out_question'.
# NOTE random_control carries the archived values verbatim (matched_metric:
# activation_mean, strict_matching: True) — the permissive matching that silently produced
# uniform controls; do NOT copy these values into new experiments.
frozen: true
model:
  adapter: hf-llava
  name: llava-hf/llava-1.5-7b-hf
  dtype: float16
  target_layer: 11
  activation_site: attn_out
  adapter_options:
    pad_to_square: true
sae:
  n_features: 32768
  l1_coeff: 0.0005
training:
  batch_size: 32
  learning_rate: 0.0001
  epochs: 10
  seed: 42
  dtype: float32
  position_type: question
reproducibility:
  seed: 42
  deterministic: true
  benchmark: false
experiment:
  output_dir: null
  output_base: output/experiments
  name: multilayer_clevr_lite_l10-14_attn_out_question
  use_timestamp: false
dataset:
  format: clevr_lite
  data_dir: datasets/clevr_lite
  split: val
  filter_held_out: null
feature_identification:
  discrimination_threshold: 2.0
  min_activation: 0.1
  top_k: 50
  min_diff: 0.0
  aggregation: mean
  selection_method: ratio
  candidate_pool_k: 200
  causal_scores_path: null
  position_type: question
  correctness_metric: option_logprob
  logprob_normalize: true
  batch_size: 256
  fallback:
    discrimination_threshold: 1.1
    min_activation: 0.0
    min_diff: 0.0
ablation:
  n_random_features: 200
  n_bootstrap: 1000
  n_random_sets: 15
  random_sampling: matched
  position_type: question
  mode: replace
  delta_scale: 1.0
  operation: zero
  operation_scale: 1.0
random_control:
  n_random_sets: 15
  sampling: matched
  seed: 42
  matched_metric: activation_mean
  strict_matching: true
evaluation:
  significance_level: 0.05
  primary_metric: forced_choice_margin
  logprob_normalize: true
sae_reuse:
  recon_threshold: 0.1
  kl_threshold: 0.5
  allow_missing_stats: true
  sample_size: 256
  search_paths:
  - output/experiments
knockout:
  flows:
  - Image->Question
  window: 1
  filter_correct: false
  normalize_logprob: true
  max_samples: null
  top_k_layers: 5
  batch_size: 1
  num_workers: 2
  output_subdir: knockout
multilayer:
  layers:
  - 10
  - 11
  - 12
  - 13
  - 14
  excluded_layers:
  - 0
  encode_mode: live
  encode_positions_only: true
  features_per_layer: 200
  sae_dtype: float32
  sae_paths:
    10: output/sae_experiments/sae_clevr_lite_layer10_attn_out_question/sae_checkpoint.pt
    11: output/sae_experiments/sae_clevr_lite_layer11_attn_out_question/sae_checkpoint.pt
    12: output/sae_experiments/sae_clevr_lite_layer12_attn_out_question/sae_checkpoint.pt
    13: output/sae_experiments/sae_clevr_lite_layer13_attn_out_question/sae_checkpoint.pt
    14: output/sae_experiments/sae_clevr_lite_layer14_attn_out_question/sae_checkpoint.pt
  catalog_paths:
    10: output/sae_experiments/sae_clevr_lite_layer10_attn_out_question_causal/results/ablation_v2/causal_feature_catalog.json
    11: output/sae_experiments/sae_clevr_lite_layer11_attn_out_question_causal/causal_feature_catalog.json
    12: output/sae_experiments/sae_clevr_lite_layer12_attn_out_question_causal/causal_feature_catalog.json
    13: output/sae_experiments/sae_clevr_lite_layer13_attn_out_question_causal/causal_feature_catalog.json
    14: output/sae_experiments/sae_clevr_lite_layer14_attn_out_question_causal/causal_feature_catalog.json
  stats_paths:
    10: output/sae_experiments/sae_clevr_lite_layer10_attn_out_question_causal/results/ablation_v2/causal_feature_stats.json
    11: output/sae_experiments/sae_clevr_lite_layer11_attn_out_question_causal/causal_feature_stats.json
    12: output/sae_experiments/sae_clevr_lite_layer12_attn_out_question_causal/causal_feature_stats.json
    13: output/sae_experiments/sae_clevr_lite_layer13_attn_out_question_causal/causal_feature_stats.json
    14: output/sae_experiments/sae_clevr_lite_layer14_attn_out_question_causal/causal_feature_stats.json
conditions:
  gate: true
  primary: true
  nested:
  - - 14
  - - 13
    - 14
  - - 12
    - 13
    - 14
  - - 11
    - 12
    - 13
    - 14
  - - 10
    - 11
    - 12
    - 13
    - 14
  non_nested:
  - - 10
    - 12
    - 14
  - - 10
    - 11
    - 12
  leave_one_out: true
  span_knockout: true
  budget_matched:
